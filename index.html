<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>My Vocabulary</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#202635;--muted:#7a8291;--line:#e7e9ef;--blue:#4169f5;--blue-soft:#eef2ff;--green:#168653;--green-bg:#e9f8f0;--red:#d44250;--red-bg:#fff0f1;--gold:#f5b400;--shadow:0 8px 28px rgba(30,40,65,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;font-weight:650;border-radius:12px;padding:11px 15px}.app{max-width:900px;margin:auto;padding:env(safe-area-inset-top) 16px 30px}
header{height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:21px;font-weight:850;letter-spacing:-.7px}.logo b{color:var(--blue)}.headerBtns{display:flex;gap:7px}.btn{background:#edf0f5;color:#30394a}.primary{background:var(--blue);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.soft{background:var(--blue-soft);color:var(--blue)}.danger{background:var(--red-bg);color:var(--red)}.tiny{padding:7px 10px;font-size:12px}
.page{display:none}.page.active{display:block}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
h2{font-size:19px;margin:0 0 14px;letter-spacing:-.4px}h3{font-size:15px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px;line-height:1.5}
.deckHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 16px}.deckHead select{max-width:220px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.stat{background:#f8f9fc;border:1px solid var(--line);border-radius:14px;padding:12px}.stat strong{font-size:21px;display:block}.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}.tab{background:#eef0f5;color:#667080}.tab.active{background:var(--blue);color:white}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.toolbar .group{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.wordList{display:flex;flex-direction:column;gap:7px;margin-top:12px}.wordRow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px}.wordRow .idx{font-size:12px;color:#a0a6b1}.wordRow .en{font-weight:700;opacity:1;color:var(--ink);overflow-wrap:anywhere}.wordRow .ko{font-size:14px;color:#626b7a;opacity:1;overflow-wrap:anywhere}.star{font-size:22px;line-height:1;background:transparent;color:#c5c9d1;padding:3px 5px}.star.on{color:var(--gold)}.rowBtns{display:flex;gap:4px}.rowBtns button{padding:6px 8px;font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:700;color:#596273}.field input,.field select,select,input[type=text]{opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink);width:100%;padding:12px;border:1px solid #dce1e8;border-radius:11px;background:#fff;color:var(--ink);outline:none}.field input:focus,input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4169f51a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:28px 12px;border:1px dashed #d6dbe5;border-radius:14px;text-align:center;color:var(--muted)}
.configCard{max-width:580px;margin:12px auto}.configCard .option{border:1px solid var(--line);padding:14px;border-radius:13px;margin:8px 0;display:flex;align-items:center;gap:10px}.option input{accent-color:var(--blue);width:18px;height:18px}.option strong{display:block}.option small{color:var(--muted)}
.studyPage{touch-action:pan-y;overscroll-behavior:none;position:fixed;inset:0;z-index:10;background:#f8f9fc;display:none;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);overflow:hidden}.studyPage.active{display:flex;flex-direction:column}.studyTop{height:58px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;max-width:760px;width:100%;margin:0 auto}.iconBtn{background:transparent;color:#626b7a;font-size:22px;padding:8px}.progressText{text-align:center;font-weight:750;font-size:14px}.studyTools{display:flex;justify-content:flex-end;max-width:760px;width:100%;margin:3px auto 0;gap:12px;align-items:center}.studyTools .star{font-size:26px}.audioBtn{background:#eef2ff;color:#315efb;border:1px solid #dfe6ff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}.audioBtn:disabled{opacity:.45}.studyTools .scopeLabel{font-size:12px;color:var(--muted)}
.studyMain{touch-action:pan-y;user-select:none;-webkit-user-select:none;width:100%;max-width:760px;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:380px;padding:20px 0}.promptType{font-size:13px;color:var(--muted);margin-bottom:18px}.promptWord{font-size:clamp(30px,7vw,48px);font-weight:800;letter-spacing:-1px;text-align:center;overflow-wrap:anywhere;padding:0 8px;min-height:60px}.answerWrap{width:100%;max-width:560px;margin-top:38px}.answerInput{font-size:22px;text-align:left;padding:16px 14px!important;border-radius:10px!important;background:white;min-height:66px}.answerInput.good,.answerInput.good:disabled{border:2px solid #78d21d!important;background:#fff!important;color:#78c91e!important;-webkit-text-fill-color:#78c91e!important;opacity:1!important}
.answerInput.bad,.answerInput.bad:disabled{border:2px solid #d94b55!important;background:#fff!important;color:#d94b55!important;-webkit-text-fill-color:#d94b55!important;opacity:1!important}
.answerInput:disabled{opacity:1!important;-webkit-text-fill-color:currentColor!important}.feedback{display:none}.answerReveal{display:flex;align-items:center;gap:12px;font-size:23px;color:#78c91e;text-align:left;margin-top:12px;min-height:38px;font-weight:500}.answerReveal .answerTag{display:inline-flex;align-items:center;justify-content:center;background:#78cf1d;color:white;border-radius:22px;padding:5px 12px;font-size:15px;font-weight:800;white-space:nowrap}.answerReveal:empty{display:none}
.studyBottom{width:100%;max-width:760px;margin:0 auto 18px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.studyBottom button{min-width:118px}.progressBar{height:5px;background:#e8ebf2;border-radius:20px;max-width:760px;width:100%;margin:0 auto}.progressBar>div{height:100%;background:var(--green);border-radius:20px;width:0}
select{padding:10px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink)}
.note{background:#f2f5ff;color:#53649b;border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.5;margin:12px 0}
.modalBack{position:fixed;inset:0;background:#11182766;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{background:white;border-radius:18px;padding:20px;width:min(420px,100%)}.modalBack.hidden{display:none}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.hidden{display:none!important}footer{text-align:center;color:#a0a6b1;font-size:11px;margin:20px 0}
@media(max-width:600px){.app{padding-left:12px;padding-right:12px}.panel{padding:14px}.wordRow{grid-template-columns:22px 1fr 1fr 32px}.rowBtns{grid-column:2/5;justify-content:flex-end}.two{grid-template-columns:1fr}.deckHead{align-items:flex-start;flex-direction:column}.deckHead select{max-width:none}.studyMain{min-height:320px}.studyBottom button{flex:1}.studyTools{padding:0 5px}}


/* Stable Classcard-like study layout on iPhone */
.studyPage{
 position:fixed!important;inset:0!important;
 width:100%!important;height:100%!important;min-height:0!important;
 overflow:hidden!important;overscroll-behavior:none!important;
 display:none;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)!important;
}
.studyPage.active{display:flex!important;flex-direction:column!important}
.studyTop,.studyTools{flex:0 0 auto!important}
.studyMain{
 flex:1 1 auto!important;min-height:0!important;
 width:100%!important;max-width:760px!important;
 margin:0 auto!important;padding:0!important;
 display:block!important;position:relative!important;
}
.promptType{
 position:absolute!important;top:clamp(88px,15vh,132px)!important;
 left:0!important;right:0!important;text-align:center!important;margin:0!important;
}
.promptWord{
 position:absolute!important;top:clamp(116px,19vh,170px)!important;
 left:0!important;right:0!important;min-height:60px!important;
}
.answerWrap{
 position:absolute!important;top:clamp(190px,32vh,285px)!important;
 left:0!important;right:0!important;width:100%!important;
 max-width:560px!important;margin:0 auto!important;
}
.studyBottom{
 flex:0 0 auto!important;width:100%!important;
 max-width:760px!important;margin:0 auto 8px!important;
}
@media(max-width:600px){
 .promptType{top:clamp(82px,14vh,120px)!important}
 .promptWord{top:clamp(112px,19vh,160px)!important}
 .answerWrap{top:clamp(182px,31vh,250px)!important}
}


/* Screenshot-matched fixed study positions, shifted slightly upward to clear
   the iOS keyboard accessory bar and reduce Safari's automatic scroll adjustment. */
.studyPage{
 position:fixed!important;inset:0!important;
 width:100%!important;height:100%!important;
 overflow:hidden!important;overscroll-behavior:none!important;
 display:none;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)!important;
}
.studyPage.active{display:block!important}
.studyTop{
 position:absolute!important;top:calc(env(safe-area-inset-top) + 6px)!important;
 left:16px!important;right:16px!important;width:auto!important;height:48px!important;
}
.studyTools{
 position:absolute!important;top:calc(env(safe-area-inset-top) + 58px)!important;
 left:16px!important;right:16px!important;width:auto!important;
 margin:0 auto!important;
}
.studyMain{
 position:absolute!important;inset:0 16px!important;
 width:auto!important;max-width:760px!important;height:100%!important;
 min-height:0!important;margin:0 auto!important;padding:0!important;
 display:block!important;
}
.promptType{
 position:absolute!important;top:25vh!important;
 left:0!important;right:0!important;text-align:center!important;
 margin:0!important;
}
.promptWord{
 position:absolute!important;top:30vh!important;
 left:0!important;right:0!important;min-height:60px!important;
}
.answerWrap{
 position:absolute!important;top:40.5vh!important;
 left:0!important;right:0!important;width:100%!important;
 max-width:560px!important;margin:0 auto!important;
}
.studyBottom{
 position:absolute!important;left:16px!important;right:16px!important;
 bottom:calc(env(safe-area-inset-bottom) + 8px)!important;
 width:auto!important;max-width:760px!important;margin:0 auto!important;
}
@media(max-width:600px){
 .promptType{top:25vh!important}
 .promptWord{top:30vh!important}
 .answerWrap{top:40.5vh!important}
}


/* Do not let the bottom action buttons push the study view above the keyboard. */
#studyPage.keyboard-focused .studyBottom{
 display:flex!important;
}
#studyPage.keyboard-focused{
 overflow:hidden!important;
}


/* iOS Safari visual viewport shell: keep the app aligned to the visible area. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:relative;width:100%;}
#homeApp.app{
 position:fixed!important;top:0!important;left:0!important;right:0!important;
 width:100%!important;max-width:none!important;height:var(--vvh,100dvh)!important;
 min-height:0!important;margin:0!important;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)!important;
 transform:translateY(var(--vvtop,0px));display:flex!important;flex-direction:column!important;
 overflow:hidden!important;overscroll-behavior:none!important;
}
.homeContent{width:100%;max-width:900px;margin:0 auto;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 20px;-webkit-overflow-scrolling:touch}
#homeApp.studying .homeContent{display:none!important}
#studyPage.studyPage{
 position:relative!important;inset:auto!important;z-index:10;display:none!important;
 flex:1 1 auto!important;min-height:0!important;width:100%!important;height:auto!important;
 max-width:none!important;margin:0!important;padding:0 16px!important;
 overflow:hidden!important;overscroll-behavior:none!important;background:#f8f9fc;
 flex-direction:column!important;transform:none!important;
}
#studyPage.studyPage.active{display:flex!important}
#studyPage .studyTop,#studyPage .progressBar,#studyPage .studyTools{flex:0 0 auto!important;width:100%!important;max-width:760px!important;margin-left:auto!important;margin-right:auto!important}
#studyPage .studyTop{height:48px!important;margin-top:0!important}
#studyPage .progressBar{margin-top:0!important}
#studyPage .studyTools{margin-top:8px!important;min-height:38px!important}
#studyPage .studyMain{
 position:relative!important;inset:auto!important;flex:1 1 auto!important;min-height:0!important;
 width:100%!important;max-width:760px!important;margin:0 auto!important;padding:16px 0!important;
 display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;
 overflow-y:auto!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch;
}
#studyPage .promptType,#studyPage .promptWord,#studyPage .answerWrap{
 position:static!important;inset:auto!important;left:auto!important;right:auto!important;top:auto!important;
}
#studyPage .promptType{margin:0 0 14px!important;text-align:center!important;}
#studyPage .promptWord{min-height:0!important;width:100%;margin:0!important;padding:0 8px!important;text-align:center!important;}
#studyPage .answerWrap{width:100%!important;max-width:560px!important;margin:26px auto 0!important;}
#studyPage .answerInput{font-size:16px!important;min-height:54px!important;padding:14px!important;}
#studyPage .studyBottom{
 position:static!important;inset:auto!important;bottom:auto!important;left:auto!important;right:auto!important;
 flex:0 0 auto!important;width:100%!important;max-width:760px!important;margin:8px auto 8px!important;
 padding-bottom:0!important;display:flex!important;
}
#studyPage.keyboard-focused .studyBottom{display:flex!important}
@media(max-width:600px){
 .homeContent{padding-left:12px;padding-right:12px}
 #studyPage .studyTools{padding:0 5px!important;gap:8px!important}
 #studyPage .studyBottom button{flex:1 1 0;min-width:0!important;padding-left:8px;padding-right:8px}
}


/* iOS Safari study layout: clear vertical flow and stable keyboard behavior */
#studyPage.studyPage.active{
  display:flex!important;
  flex-direction:column!important;
  justify-content:flex-start!important;
}
#studyPage .studyTop{flex:0 0 48px!important}
#studyPage .progressBar{flex:0 0 5px!important}
#studyPage .studyTools{
  position:static!important;
  flex:0 0 auto!important;
  margin:8px auto 0!important;
  min-height:42px!important;
}
#studyPage .studyMain{
  position:relative!important;
  inset:auto!important;
  display:flex!important;
  flex:1 1 auto!important;
  flex-direction:column!important;
  justify-content:flex-start!important;
  align-items:center!important;
  min-height:0!important;
  overflow-y:auto!important;
  padding:clamp(18px,4vh,42px) 0 12px!important;
  margin:0 auto!important;
}
#studyPage .promptType{
  position:static!important;
  inset:auto!important;
  width:100%!important;
  margin:0 0 12px!important;
  text-align:center!important;
  line-height:1.4!important;
}
#studyPage .promptWord{
  position:static!important;
  inset:auto!important;
  width:100%!important;
  min-height:0!important;
  margin:0!important;
  line-height:1.2!important;
}
#studyPage .answerWrap{
  position:static!important;
  inset:auto!important;
  width:100%!important;
  margin:24px auto 0!important;
}
#studyPage .answerInput{font-size:16px!important}
#studyPage .studyBottom{
  position:static!important;
  flex:0 0 auto!important;
  margin:8px auto 8px!important;
  padding-bottom:env(safe-area-inset-bottom)!important;
}

/* iOS study layout: keep prompt readable and anchor the answer area near the keyboard. */
html,body{overflow:hidden;overscroll-behavior:none}
.studyPage{height:var(--vvh,100dvh)!important;top:var(--vvtop,0px)!important;bottom:auto!important;inset-inline:0!important;display:none;overflow:hidden;transition:none}
.studyPage.active{display:flex;flex-direction:column}
.studyTop,.progressBar,.studyTools,.studyBottom{flex:none}
.studyMain{flex:1;min-height:0!important;margin:0 auto!important;padding:14px 0 10px!important;justify-content:flex-start!important;align-items:center;overflow-y:auto;overscroll-behavior:contain}
.promptType{margin:0 0 8px!important;line-height:1.35}
.promptWord{min-height:0!important;line-height:1.15;margin:0!important}
.answerWrap{margin-top:auto!important;padding-top:clamp(18px,5vh,44px);padding-bottom:8px}
.answerInput{font-size:16px!important}
.studyBottom{margin:0 auto max(10px,env(safe-area-inset-bottom))!important;padding-top:8px;transition:margin-bottom .16s ease-out}
.studyPage.keyboard-focused .studyMain{padding-bottom:4px!important}
.studyPage.keyboard-focused .answerWrap{padding-top:12px;padding-bottom:4px}
.studyPage.keyboard-focused .studyBottom{margin-bottom:6px!important}
</style>
</head>
<body>
<div class="app" id="homeApp">
<div class="homeContent">
<header><div class="logo">My <b>Vocabulary</b></div><div class="headerBtns"><button class="outline tiny" id="importBtn">CSV 가져오기</button><button class="outline tiny" id="exportBtn">내보내기</button></div></header>

<section class="page active" id="listPage">
  <div class="deckHead"><div><div class="muted">MY WORD BOOK</div><h2 id="deckTitle" style="margin:3px 0 0">기본 단어장</h2></div><select id="deckSelect" aria-label="단어장 선택"></select></div>
  <div class="toolbar" style="margin:12px 0 14px"><span class="muted">단어를 확인하고 바로 학습을 시작하세요.</span><button class="primary" id="learnTopBtn">학습하기 →</button></div>
  <div class="stats"><div class="stat"><strong id="totalN">0</strong><span>전체 단어</span></div><div class="stat"><strong id="starN">0</strong><span>별표 단어</span></div><div class="stat"><strong id="knownN">0</strong><span>암기 완료</span></div></div>
  <div class="toolbar"><div class="group"><button class="tab active" id="allTab">전체 단어</button><button class="tab" id="starTab">★ 별표 단어</button></div><div class="group"><button class="outline tiny" id="renameDeck">단어장 이름</button><button class="danger tiny" id="deleteDeck">단어장 삭제</button><button class="outline tiny" id="newDeck">＋ 단어장</button></div></div>
  <div class="wordList" id="wordList"></div>
  <div class="toolbar" style="margin-top:16px"><button class="outline" id="addWordBtn">＋ 단어 추가</button><button class="primary" id="learnBtn">학습하기 →</button></div>
</section>

<section class="page" id="addPage">
  <div class="toolbar"><h2>단어 등록</h2><button class="outline tiny" id="backList1">← 단어장</button></div>
  <form id="wordForm"><div class="two"><div class="field"><label>영어 단어</label><input id="enInput" required placeholder="예: abandon"></div><div class="field"><label>한글 뜻</label><input id="koInput" required placeholder="예: 버리다"></div></div><button class="primary" type="submit">등록하기</button></form>
  <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
  <h3>여러 단어 한 번에 등록</h3><p class="muted">한 줄에 영어,쉼표,한글 뜻 순서로 입력하세요.</p>
  <textarea id="bulkInput" rows="7" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit" placeholder="abandon,버리다&#10;repair,수리하다"></textarea><button class="outline" id="bulkBtn" style="margin-top:10px">일괄 등록</button>
</section>

<section class="page" id="configPage">
  <div class="toolbar"><button class="iconBtn" id="configBack">‹</button><h2 style="margin:0">학습 설정</h2><span style="width:40px"></span></div>
  <div class="panel configCard">
    <h3>어떤 방식으로 학습할까요?</h3>
    <label class="option"><input type="radio" name="mode" value="en-ko" checked><span><strong>뜻 입력</strong><small>영어 단어를 보고 한글 뜻 입력</small></span></label>
    <label class="option"><input type="radio" name="mode" value="ko-en"><span><strong>스펠링 입력</strong><small>한글 뜻을 보고 영어 스펠링 입력</small></span></label>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <h3>학습할 단어 구간</h3>
    <div class="field"><label>한 구간에 학습할 단어 수</label><select id="chunkSize"><option value="5">5개씩</option><option value="10" selected>10개씩</option><option value="15">15개씩</option><option value="20">20개씩</option><option value="all">전체 단어</option></select></div>
    <div class="field"><label>시작할 구간</label><select id="chunkNumber"></select></div>
    <label class="option"><input type="checkbox" id="starOnly"><span><strong>별표 단어만 학습</strong><small>별표 표시한 단어만 순서대로 출제</small></span></label>
    <div class="note" id="configSummary">등록 순서대로 10개씩 학습합니다.</div>
    <button class="outline hidden" style="width:100%;padding:13px;margin-bottom:8px" id="resumeStudy">이어서 학습하기</button>
    <button class="primary" style="width:100%;padding:15px" id="startStudy">처음부터 학습하기</button>
  </div>
</section>
<footer>My Vocabulary · 단어 데이터는 이 브라우저에 저장됩니다.</footer>
</div>

<section class="studyPage" id="studyPage">
  <div class="studyTop"><button class="iconBtn" id="exitStudy" aria-label="학습 종료">‹</button><div class="progressText" id="progressText">1 / 10</div><button class="iconBtn" id="resetStudy" aria-label="다시 시작">↻</button></div>

<script>
// Keep the study surface aligned with the currently visible iOS Safari viewport.
(function(){
 const vv=window.visualViewport;
 let scheduled=false;
 function fit(){
  if(scheduled)return;
  scheduled=true;
  requestAnimationFrame(()=>{
   scheduled=false;
   const r=document.documentElement.style;
   r.setProperty('--vvh',Math.round(vv?vv.height:window.innerHeight)+'px');
   r.setProperty('--vvtop',Math.round(vv?vv.offsetTop:0)+'px');
  });
 }
 vv?.addEventListener('resize',fit,{passive:true});
 vv?.addEventListener('scroll',fit,{passive:true});
 window.addEventListener('resize',fit,{passive:true});
 fit();
})();;
const STORE='myVocabulary_v2';
const uid=()=>Math.random().toString(36).slice(2,10);
let state;try{state=JSON.parse(localStorage.getItem(STORE))||JSON.parse(localStorage.getItem('myVocabularyApp_v1'))}catch(e){}
if(!state||!state.decks?.length)state={active:null,decks:[{id:uid(),name:'기본 단어장',words:[]}]};
state.decks.forEach(d=>d.words.forEach(w=>{if(w.starred===undefined)w.starred=false;if(w.wrong===undefined)w.wrong=0;if(w.known===undefined)w.known=false}));
if(!state.active||!state.decks.some(d=>d.id===state.active))state.active=state.decks[0].id;
let listFilter='all',modalAction=null,studyItems=[],studyQueue=[],studyIndex=0,studyMode='en-ko',answered=false,chunkStart=0,chunkEnd=0,chunkSizeValue=10,chunkPart=0,starFilter=false,completedIds=new Set(),touchX=null,finished=false;
const pronunciationCache=new Map();let activePronunciationAudio=null,pronunciationRequest=0;
const $=id=>document.getElementById(id),book=()=>state.decks.find(d=>d.id===state.active),words=()=>book().words;
const save=()=>localStorage.setItem(STORE,JSON.stringify(state));
function getSavedSession(){return state.studySessions?.[state.active]||null}
function persistStudySession(){
 if(!state.studySessions)state.studySessions={};
 state.studySessions[state.active]={
  itemIds:studyItems.map(w=>w.id), queueIds:studyQueue.map(w=>w.id),
  index:studyIndex, mode:studyMode, chunkStart, chunkEnd, chunkPart,
  completedIds:[...completedIds], starOnly:$('starOnly').checked,
  chunkSize:$('chunkSize').value, finished
 };
 save(); updateResumeButton();
}
function clearSavedSession(){
 if(state.studySessions)delete state.studySessions[state.active];
 save(); updateResumeButton();
}
function updateResumeButton(){
 const s=getSavedSession(),valid=s&&s.itemIds?.length&&s.queueIds?.length&&s.itemIds.every(id=>words().some(w=>w.id===id));
 $('resumeStudy').classList.toggle('hidden',!valid);
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id))}
function render(){
 $('deckSelect').innerHTML=state.decks.map(d=>`<option value="${d.id}" ${d.id===state.active?'selected':''}>${esc(d.name)}</option>`).join('');
 $('deckTitle').textContent=book().name;
 $('totalN').textContent=words().length;$('starN').textContent=words().filter(w=>w.starred).length;$('knownN').textContent=words().filter(w=>w.known).length;
 let arr=words().map((w,i)=>({...w,_index:i})).filter(w=>listFilter==='all'||w.starred);
 $('allTab').classList.toggle('active',listFilter==='all');$('starTab').classList.toggle('active',listFilter==='star');
 $('wordList').innerHTML=arr.length?arr.map(w=>`<div class="wordRow"><span class="idx">${w._index+1}</span><strong class="en">${esc(w.en)}</strong><span class="ko">${esc(w.ko)}</span><button class="star ${w.starred?'on':''}" data-star="${w.id}" aria-label="별표">${w.starred?'★':'☆'}</button><div class="rowBtns"><button class="outline" data-up="${w._index}" ${w._index===0?'disabled':''}>↑</button><button class="outline" data-down="${w._index}" ${w._index===words().length-1?'disabled':''}>↓</button><button class="outline" data-edit="${w.id}">수정</button><button class="danger" data-del="${w.id}">삭제</button></div></div>`).join(''):'<div class="empty">표시할 단어가 없습니다.</div>';
 document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{const w=words().find(x=>x.id===b.dataset.star);w.starred=!w.starred;save();render()});
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));
 document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1));
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('이 단어를 삭제할까요?')){book().words=words().filter(w=>w.id!==b.dataset.del);save();render()}});
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editWord(b.dataset.edit));
}
function move(i,delta){let a=words(),j=i+delta;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function editWord(id){
 const w=words().find(x=>x.id===id);if(!w)return;
 modalAction={type:'editWord',id};
 $('modalTitle').textContent='단어 수정';
 $('modalLabel').textContent='영어 스펠링';
 $('modalValue').value=w.en;
 $('modalValue2Wrap').classList.remove('hidden');
 $('modalLabel2').textContent='한글 뜻';
 $('modalValue2').value=w.ko;
 $('modal').classList.remove('hidden');
 $('modalValue').focus();
}
function openModal(title,label,value,action){modalAction=action;$('modalTitle').textContent=title;$('modalLabel').textContent=label;$('modalValue').value=value||'';$('modalValue2Wrap').classList.add('hidden');$('modalValue2').value='';$('modal').classList.remove('hidden');$('modalValue').focus()}
function closeModal(){$('modal').classList.add('hidden');modalAction=null}
$('modalCancel').onclick=closeModal;
$('modalOk').onclick=()=>{
 const v=$('modalValue').value.trim();
 if(!v)return;
 if(modalAction==='new'){
  state.decks.push({id:uid(),name:v,words:[]});state.active=state.decks.at(-1).id;
 }else if(modalAction==='rename')book().name=v;
 else if(modalAction&&modalAction.type==='editWord'){
  const w=words().find(x=>x.id===modalAction.id);
  const ko=$('modalValue2').value.trim();
  if(!w||!ko){alert('영어 스펠링과 한글 뜻을 모두 입력해 주세요.');return}
  w.en=v;w.ko=ko;
 }
 closeModal();save();render();
};
$('newDeck').onclick=()=>openModal('새 단어장','단어장 이름','', 'new');
$('renameDeck').onclick=()=>openModal('단어장 이름 변경','단어장 이름',book().name,'rename');
$('deleteDeck').onclick=()=>{
 if(state.decks.length===1){alert('마지막 단어장은 삭제할 수 없습니다.');return}
 if(!confirm(`'${book().name}' 단어장과 안의 단어 ${words().length}개를 모두 삭제할까요?`))return;
 const removedId=state.active;
 state.decks=state.decks.filter(d=>d.id!==removedId);
 state.active=state.decks[0].id;
 if(state.studySessions)delete state.studySessions[removedId];
 save();render();
};
$('deckSelect').onchange=()=>{state.active=$('deckSelect').value;save();render()};
$('allTab').onclick=()=>{listFilter='all';render()};$('starTab').onclick=()=>{listFilter='star';render()};
$('addWordBtn').onclick=()=>showPage('add');$('backList1').onclick=()=>{showPage('listPage');render()};
$('wordForm').onsubmit=e=>{e.preventDefault();words().push({id:uid(),en:$('enInput').value.trim(),ko:$('koInput').value.trim(),starred:false,known:false,wrong:0});$('enInput').value='';$('koInput').value='';save();render();$('enInput').focus()};
$('bulkBtn').onclick=()=>{let n=0;for(let line of $('bulkInput').value.split(/\r?\n/)){let p=line.split(',');if(p.length>1&&p[0].trim()&&p.slice(1).join(',').trim()){words().push({id:uid(),en:p[0].trim(),ko:p.slice(1).join(',').trim(),starred:false,known:false,wrong:0});n++}}$('bulkInput').value='';save();render();alert(`${n}개 단어를 등록했습니다.`)};
$('learnBtn').onclick=$('learnTopBtn').onclick=()=>{if(!words().length){alert('먼저 단어를 등록하세요.');return}showPage('configPage');updateChunks();updateResumeButton()};
$('configBack').onclick=()=>showPage('listPage');
$('chunkSize').onchange=updateChunks;$('starOnly').onchange=updateChunks;
function updateChunks(){let arr=words().filter(w=>!$('starOnly').checked||w.starred),size=$('chunkSize').value==='all'?Math.max(arr.length,1):+$('chunkSize').value,total=Math.max(1,Math.ceil(arr.length/size));$('chunkNumber').innerHTML=Array.from({length:total},(_,i)=>`<option value="${i}">${i+1}구간 · ${i*size+1}~${Math.min((i+1)*size,arr.length)}번</option>`).join('');$('configSummary').textContent=arr.length?`등록 순서대로 ${size===arr.length?'전체':size+'개씩'} 학습합니다. 총 ${total}개 구간입니다.`:'선택한 조건에 해당하는 단어가 없습니다.'}
$('startStudy').onclick=()=>beginChunk(+$('chunkNumber').value);$('resumeStudy').onclick=()=>beginChunk(0,true);
function beginChunk(part,resume=false){
 const arr=words().filter(w=>!$('starOnly').checked||w.starred);
 if(!arr.length){alert('선택한 조건에 해당하는 단어가 없습니다.');return}
 if(resume){
  const s=getSavedSession();
  if(!s||!s.itemIds?.every(id=>words().some(w=>w.id===id))){alert('이어서 학습할 기록이 없습니다. 처음부터 시작해 주세요.');updateResumeButton();return}
  studyItems=s.itemIds.map(id=>words().find(w=>w.id===id));
  studyQueue=s.queueIds.map(id=>words().find(w=>w.id===id)).filter(Boolean);
  studyIndex=Math.min(s.index||0,studyQueue.length);
  studyMode=s.mode||'en-ko';chunkStart=s.chunkStart||0;chunkEnd=s.chunkEnd||studyItems.length;
  chunkPart=s.chunkPart||0;completedIds=new Set(s.completedIds||[]);
  $('starOnly').checked=!!s.starOnly;$('chunkSize').value=s.chunkSize||'10';
  document.querySelector(`input[name="mode"][value="${studyMode}"]`).checked=true;
 }else{
  const rawSize=$('chunkSize').value;
  const size=rawSize==='all'?arr.length:+rawSize;
  const total=Math.ceil(arr.length/size);
  chunkPart=Math.max(0,Math.min(+part||0,total-1));
  chunkStart=chunkPart*size;
  chunkEnd=Math.min(chunkStart+size,arr.length);
  studyItems=arr.slice(chunkStart,chunkEnd);
  studyQueue=studyItems.slice();
  studyIndex=0;completedIds=new Set();studyMode=document.querySelector('input[name="mode"]:checked')?.value||'en-ko';
 }
 answered=false;finished=false;
 window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;$('homeApp').classList.add('studying');$('studyPage').classList.add('active');
 $('nextQuestion').onclick=next;
 persistStudySession();
 showQuestion();
}
function closeStudy(){ stopPronunciation();if(!finished)persistStudySession();$('studyPage').classList.remove('active');$('homeApp').classList.remove('studying');showPage('listPage');render()}
$('exitStudy').onclick=closeStudy;$('resetStudy').onclick=()=>{studyQueue=studyItems.slice();studyIndex=0;completedIds=new Set();answered=false;finished=false;$('studyAnswer').classList.remove('hidden');persistStudySession();showQuestion()};

function stopPronunciation(){
 pronunciationRequest++;
 if(activePronunciationAudio){activePronunciationAudio.pause();activePronunciationAudio.currentTime=0;activePronunciationAudio=null}
 if('speechSynthesis' in window)window.speechSynthesis.cancel();
}
async function getPronunciationAudio(word){
 const key=String(word||'').trim().toLowerCase();
 if(pronunciationCache.has(key))return pronunciationCache.get(key);
 const task=(async()=>{
  try{
   const response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key),{cache:'force-cache'});
   if(!response.ok)return null;
   const entries=await response.json();
   const phonetics=(Array.isArray(entries)?entries:[]).flatMap(entry=>entry.phonetics||[]);
   const audioItems=phonetics.filter(item=>item.audio).map(item=>String(item.audio).startsWith('//')?'https:'+item.audio:item.audio);
   const us=audioItems.find(url=>/(?:-us|_us|\/us(?:[-_.]|$))/i.test(url));
   return us||audioItems.find(url=>!/(?:-uk|_uk|\/uk(?:[-_.]|$)|-au|_au)/i.test(url))||audioItems[0]||null;
  }catch(error){return null}
 })();
 pronunciationCache.set(key,task);
 return task;
}
async function speakFallback(word){
 if(!('speechSynthesis' in window))return;
 const synth=window.speechSynthesis;
 let voices=synth.getVoices();
 if(!voices.length){
  await new Promise(resolve=>{
   let done=false;const finish=()=>{if(done)return;done=true;resolve()};
   synth.addEventListener?.('voiceschanged',finish,{once:true});
   setTimeout(finish,700);
  });
  voices=synth.getVoices();
 }
 const utterance=new SpeechSynthesisUtterance(word);
 utterance.lang='en-US';utterance.rate=0.88;
 const usVoice=voices.find(v=>/^en-US$/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
 if(usVoice)utterance.voice=usVoice;
 synth.cancel();synth.speak(utterance);
}
async function playPronunciation(word,auto=false){
 if(studyMode!=='en-ko'||!word)return;
 const request=++pronunciationRequest;
 if(activePronunciationAudio){activePronunciationAudio.pause();activePronunciationAudio.currentTime=0;activePronunciationAudio=null}
 if('speechSynthesis' in window)window.speechSynthesis.cancel();
 const btn=$('replayPronunciation');if(btn)btn.disabled=true;
 const url=await getPronunciationAudio(word);
 if(request!==pronunciationRequest)return;
 const candidates=[];
 if(url)candidates.push(url);
 candidates.push('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q='+encodeURIComponent(word));
 let played=false;
 for(const src of candidates){
  if(request!==pronunciationRequest)break;
  const audio=new Audio(src);audio.preload='auto';activePronunciationAudio=audio;
  try{await audio.play();played=true;break}catch(error){audio.pause();activePronunciationAudio=null}
 }
 if(!played&&request===pronunciationRequest)await speakFallback(word);
 if(btn)btn.disabled=false;
}
function showQuestion(){
 if(finished)return;
 stopPronunciation();
 if(studyIndex>=studyQueue.length){finishStudy();return}
 answered=false;let w=studyQueue[studyIndex];
 $('progressText').textContent=`${completedIds.size} / ${studyItems.length}`;
 $('progressFill').style.width=(completedIds.size/studyItems.length*100)+'%';
 $('studyRangeLabel').textContent=`${chunkStart+1}~${chunkEnd}번 · ${studyIndex+1}번째 시도`;
 $('studyStar').textContent=w.starred?'★':'☆';$('studyStar').classList.toggle('on',w.starred);
 $('promptType').textContent=studyMode==='en-ko'?'영어 단어의 한글 뜻을 입력하세요':'한글 뜻의 영어 스펠링을 입력하세요';
 $('promptWord').textContent=studyMode==='en-ko'?w.en:w.ko;
 $('replayPronunciation').classList.toggle('hidden',studyMode!=='en-ko');
 $('studyAnswer').value='';$('studyAnswer').disabled=false;$('studyAnswer').readOnly=false;$('studyAnswer').className='answerInput';$('feedback').textContent='';$('feedback').className='feedback';$('answerReveal').replaceChildren();
 $('submitAnswer').classList.remove('hidden');$('nextQuestion').classList.add('hidden');$('nextQuestion').textContent='다음 단어';$('nextQuestion').onclick=next;$('showAnswer').classList.remove('hidden');
 /* 입력창 자동 포커스를 제거해 iOS Safari가 학습 화면을 키보드 위치로 자동 이동시키지 않도록 함 */if(studyMode==='en-ko')playPronunciation(w.en,true);
}
$('studyStar').onclick=()=>{let w=studyItems[studyIndex];w.starred=!w.starred;$('studyStar').textContent=w.starred?'★':'☆';$('studyStar').classList.toggle('on',w.starred);save()};
$('replayPronunciation').onclick=()=>{let w=studyQueue[studyIndex];if(w&&studyMode==='en-ko')playPronunciation(w.en,false)};

function norm(s){return String(s).toLocaleLowerCase().replace(/\s/g,'').trim()}
function acceptedForms(text){
 const result=new Set();
 const add=value=>{
  value=String(value??'').trim();
  if(!value)return;
  result.add(value);
  const noParen=value.replace(/\([^)]*\)/g,'');
  result.add(noParen);
  // comma-separated alternatives
  [value,noParen].forEach(v=>v.split(',').forEach(part=>result.add(part.trim())));
  // Bracket notation: e.g. 조사[연구]하다 -> 조사하다 / 연구하다
  const re=/([^()[\]]*)\[([^\]]+)\]([^()[\]]*)/g;
  let m;
  while((m=re.exec(noParen))!==null){
   const before=m[1],inside=m[2],after=m[3];
   result.add(before+after);
   result.add(before+inside+after);
   const prefix=before.replace(/[가-힣A-Za-z0-9_]+$/,'');
   result.add(prefix+inside+after);
   inside.split(',').forEach(part=>result.add(prefix+part.trim()+after));
  }
 };
 add(text);
 return [...result].filter(Boolean);
}
function isCorrectAnswer(input,expected){
 const typed=norm(input);
 return acceptedForms(expected).some(form=>norm(form)===typed);
}

function submit(){
 if(answered||finished)return;let w=studyQueue[studyIndex],val=$('studyAnswer').value;if(!val.trim()){next();return;}
 let expected=studyMode==='en-ko'?w.ko:w.en,ok=isCorrectAnswer(val,expected);answered=true;
 if(ok){
  completedIds.add(w.id);w.known=true;$('studyAnswer').classList.add('good');$('feedback').textContent='✓ 정답입니다';$('feedback').className='feedback good';showAnswerLabel(expected);
 }else{
  w.wrong=(w.wrong||0)+1;$('studyAnswer').classList.add('bad');$('feedback').textContent='✕ 오답입니다';$('feedback').className='feedback bad';showAnswerLabel(expected);
 }
 $('progressText').textContent=`${completedIds.size} / ${studyItems.length}`;
 $('progressFill').style.width=(completedIds.size/studyItems.length*100)+'%';
 $('studyAnswer').readOnly=true;$('studyAnswer').blur();$('studyPage').classList.remove('keyboard-focused');$('submitAnswer').classList.add('hidden');$('showAnswer').classList.add('hidden');$('nextQuestion').classList.remove('hidden');
 if(studyMode==='en-ko')playPronunciation(w.en,true);
 save();renderStatsOnly();persistStudySession();
}
function showAnswerLabel(text){
 const box=$('answerReveal');box.replaceChildren();
 if(!text)return;
 const tag=document.createElement('span');tag.className='answerTag';tag.textContent='정답';
 const value=document.createElement('span');value.textContent=text;
 box.append(tag,value);
}
function renderStatsOnly(){$('totalN').textContent=words().length;$('starN').textContent=words().filter(w=>w.starred).length;$('knownN').textContent=words().filter(w=>w.known).length}
function next(){
 if(finished)return;
 let current=studyQueue[studyIndex];
 if(!current)return;
 if(!answered){
  current.wrong=(current.wrong||0)+1;
  const expected=studyMode==='en-ko'?current.ko:current.en;
  $('studyAnswer').disabled=true;$('studyAnswer').blur();$('studyPage').classList.remove('keyboard-focused');
  $('studyAnswer').classList.add('bad');
  $('feedback').textContent='모르는 단어로 처리했습니다';
  $('feedback').className='feedback bad';
  showAnswerLabel(expected);
  answered=true;
  $('submitAnswer').classList.add('hidden');
  $('showAnswer').classList.add('hidden');
  $('nextQuestion').classList.remove('hidden');$('nextQuestion').textContent='다음 단어';$('nextQuestion').onclick=next;
  if(studyMode==='en-ko')playPronunciation(current.en,true);
  save();renderStatsOnly();persistStudySession();
  return;
 }
 if(!completedIds.has(current.id))studyQueue.push(current);
 studyIndex++;
 persistStudySession();
 if(completedIds.size===studyItems.length){finishStudy();return}
 showQuestion();
}
function finishStudy(){
 stopPronunciation();finished=true;clearSavedSession();$('progressText').textContent=`${studyItems.length} / ${studyItems.length}`;$('progressFill').style.width='100%';
 $('promptType').textContent=`제 ${chunkPart+1}구간 학습 완료`;$('promptWord').textContent='GOOD JOB!';
 $('studyAnswer').classList.add('hidden');$('feedback').textContent='구간의 모든 단어를 한 번 이상 정답으로 맞혔습니다.';$('feedback').className='feedback good';
 $('answerReveal').textContent='다음 구간으로 이동하거나 단어장으로 돌아갈 수 있습니다.';
 $('submitAnswer').classList.add('hidden');$('showAnswer').classList.add('hidden');
 $('nextQuestion').classList.remove('hidden');
 let arr=words().filter(w=>!$('starOnly').checked||w.starred),total=$('chunkSize').value==='all'?arr.length:+$('chunkSize').value;
 let hasNext=chunkEnd<arr.length;
 $('nextQuestion').textContent=hasNext?'다음 구간으로 이동':'단어장으로 돌아가기';

const studySurface=$('studyPage');
let swipeStart=null;
const swipeTargets=[$('studyPage'),$('studyMain')].filter(Boolean);
function swipeBegin(x,y){swipeStart={x,y,time:Date.now()}}
function swipeFinish(x,y){
 if(!swipeStart)return;
 const dx=x-swipeStart.x,dy=y-swipeStart.y;
 swipeStart=null;
 if(dx>55&&Math.abs(dx)>Math.abs(dy)*1.2)next();
}
studySurface.addEventListener('touchstart',e=>{
 if(e.touches.length===1)swipeBegin(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true,capture:true});
studySurface.addEventListener('touchend',e=>{
 if(e.changedTouches.length)swipeFinish(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
},{passive:true,capture:true});
studySurface.addEventListener('touchcancel',()=>{swipeStart=null},{passive:true,capture:true});
studySurface.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'||e.pointerType==='pen')swipeBegin(e.clientX,e.clientY);
});
studySurface.addEventListener('pointerup',e=>{
 if(e.pointerType==='mouse'||e.pointerType==='pen')swipeFinish(e.clientX,e.clientY);
});

function parseCSV(text){
 const rows=[];let row=[],field='',quoted=false;
 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(quoted){
   if(ch==='"'){
    if(text[i+1]==='"'){field+='"';i++}
    else quoted=false;
   }else field+=ch;
  }else{
   if(ch==='"'&&field.length===0)quoted=true;
   else if(ch===','){row.push(field);field=''}
   else if(ch==='\r'||ch==='\n'){
    row.push(field);field='';
    if(row.some(v=>v.length>0))rows.push(row);
    row=[];
    if(ch==='\r'&&text[i+1]==='\n')i++;
   }else field+=ch;
  }
 }
 if(field.length||row.length){row.push(field);rows.push(row)}
 return rows;
}
function isCSVHeader(row){
 if(!row||!row.length)return false;
 const first=String(row[0]||'').trim().toLocaleLowerCase();
 const second=String(row[1]||'').trim().toLocaleLowerCase();
 const firstHeader=/^(english|english word|word|words|단어|영어|영단어|표제어)$/i.test(first);
 const secondHeader=/^(korean|meaning|definition|뜻|의미|한글|한국어|해석)$/i.test(second);
 return firstHeader||secondHeader;
}
$('fileInput').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const txt=(await f.text()).replace(/^\uFEFF/,'');
  const rows=parseCSV(txt);let count=0;
  for(let i=0;i<rows.length;i++){
   const cols=rows[i];if(i===0&&isCSVHeader(cols))continue;
   if(cols.length<2)continue;
   const en=String(cols[0]??'').trim();
   const ko=cols.slice(1).join(',').trim();
   if(!en||!ko)continue;
   words().push({id:uid(),en,ko,starred:false,known:false,wrong:0});count++;
  }
  save();render();alert(`${count}개 단어를 가져왔습니다.`);
 }catch(err){alert('CSV 파일을 읽지 못했습니다. 파일 형식을 확인해 주세요.');}
 e.target.value='';
};
